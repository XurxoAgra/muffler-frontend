<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Muffler · Perfil · Light</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body, #root { width: 100%; height: 100%; overflow: hidden; }
  body { background: #F4F5F0; font-family: 'Space Grotesk', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; }
  input  { font-family: inherit; }
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(26,36,16,0.12); border-radius: 2px; }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="env,react">
const { useState } = React;

// ── Design tokens — LIGHT ─────────────────────────────────────────────────────
const C = {
  bg:        "#F4F5F0",        // warm off-white canvas
  sidebar:   "#FFFFFF",        // pure white sidebar
  surf:      "#FFFFFF",        // card surface
  surfInner: "#F9FAF6",        // inner field area
  accent:    "#2D7A00",        // dark lime (readable on white)
  accentBg:  "rgba(45,122,0,0.07)",
  accentStr: "rgba(45,122,0,0.20)",
  ink:       "#141A0F",        // near-black
  muted:     "#6B7266",        // mid-grey green
  subtle:    "#C4CAB8",        // very light
  stroke:    "rgba(45,122,0,0.14)",
  strokeAlt: "rgba(20,26,15,0.08)",
  danger:    "#C53030",
};

const MONO = "'JetBrains Mono', ui-monospace, monospace";
const SANS = "'Space Grotesk', system-ui, sans-serif";

// ── Muffler wordmark ──────────────────────────────────────────────────────────
function MufflerMark({ size = 20, color = C.accent }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" style={{ display: "block", flexShrink: 0 }}>
      <rect x="2"    y="4"   width="3" height="16" rx="1" fill={color} opacity="1">
        <animate attributeName="height" values="16;7;16" dur="2.8s" repeatCount="indefinite" />
      </rect>
      <rect x="7.5"  y="7"   width="3" height="10" rx="1" fill={color} opacity="0.70">
        <animate attributeName="height" values="10;15;10" dur="2.8s" repeatCount="indefinite" />
      </rect>
      <rect x="13"   y="9.5" width="3" height="5"  rx="1" fill={color} opacity="0.44">
        <animate attributeName="height" values="5;11;5" dur="2.8s" repeatCount="indefinite" />
      </rect>
      <rect x="18.5" y="11"  width="3" height="2"  rx="1" fill={color} opacity="0.22" />
    </svg>
  );
}

// ── Icons ─────────────────────────────────────────────────────────────────────
const Ico = {
  profile: (col) => (
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke={col} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
      <circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
    </svg>
  ),
  dashboard: (col) => (
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke={col} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
      <rect x="3" y="3" width="7" height="7" rx="1.5"/>
      <rect x="14" y="3" width="7" height="7" rx="1.5"/>
      <rect x="3" y="14" width="7" height="7" rx="1.5"/>
      <rect x="14" y="14" width="7" height="7" rx="1.5"/>
    </svg>
  ),
  settings: (col) => (
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke={col} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
    </svg>
  ),
  signout: (col) => (
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke={col} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
      <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
      <polyline points="16 17 21 12 16 7"/>
      <line x1="21" y1="12" x2="9" y2="12"/>
    </svg>
  ),
  chevronLeft: (col) => (
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke={col} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <polyline points="15 18 9 12 15 6"/>
    </svg>
  ),
  edit: () => (
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
      <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
    </svg>
  ),
};

// ── Role badge ─────────────────────────────────────────────────────────────────
const ROLE_MAP = {
  "Admin":  { bg: "rgba(45,122,0,0.08)",   color: C.accent,   border: "rgba(45,122,0,0.22)" },
  "Editor": { bg: "rgba(37,99,235,0.07)",  color: "#1D4ED8",  border: "rgba(37,99,235,0.18)" },
  "Member": { bg: "rgba(20,26,15,0.05)",   color: C.muted,    border: C.strokeAlt },
};
function RoleBadge({ role }) {
  const s = ROLE_MAP[role] || ROLE_MAP.Member;
  return (
    <span style={{
      display: "inline-flex", alignItems: "center", gap: 6,
      padding: "3px 10px 3px 8px", borderRadius: 999,
      background: s.bg, color: s.color, border: `1px solid ${s.border}`,
      fontFamily: MONO, fontSize: 10, fontWeight: 600, letterSpacing: "0.10em", textTransform: "uppercase",
    }}>
      <span style={{ width: 5, height: 5, borderRadius: "50%", background: s.color, display: "inline-block", flexShrink: 0 }} />
      {role}
    </span>
  );
}

// ── Avatar (illustrated) ──────────────────────────────────────────────────────
function ProfileAvatar({ size = 84 }) {
  const inner = size * 0.72;
  return (
    <div style={{
      width: size, height: size, flexShrink: 0, borderRadius: "50%",
      background: C.accentBg,
      border: `1.5px solid ${C.accentStr}`,
      display: "flex", alignItems: "center", justifyContent: "center",
      overflow: "hidden",
    }}>
      <svg width={inner} height={inner} viewBox="0 0 48 48" fill="none">
        <circle cx="24" cy="17" r="9" fill={C.accent} opacity="0.10" />
        <circle cx="24" cy="17" r="9" fill="none" stroke={C.accent} strokeWidth="1.5" opacity="0.70" />
        <circle cx="20.5" cy="16" r="1.3" fill={C.accent} opacity="0.60" />
        <circle cx="27.5" cy="16" r="1.3" fill={C.accent} opacity="0.60" />
        <path d="M20.5 20.5 Q24 23.5 27.5 20.5" stroke={C.accent} strokeWidth="1.2" strokeLinecap="round" fill="none" opacity="0.60" />
        <path d="M7 44 C7 33 15 29 24 29 C33 29 41 33 41 44" fill={C.accent} opacity="0.07" />
        <path d="M7 44 C7 33 15 29 24 29 C33 29 41 33 41 44" stroke={C.accent} strokeWidth="1.5" strokeLinecap="round" fill="none" opacity="0.50" />
      </svg>
    </div>
  );
}

// ── Profile field ─────────────────────────────────────────────────────────────
function ProfileField({ label, value, editable = false, mono = false, badgeEl }) {
  const [editing, setEditing] = useState(false);
  const [val, setVal]         = useState(value);

  return (
    <div style={{
      display: "grid", gridTemplateColumns: "150px 1fr auto",
      alignItems: "center", gap: 16,
      padding: "16px 0",
      borderBottom: `1px solid ${C.strokeAlt}`,
    }}>
      <span style={{
        fontFamily: MONO, fontSize: 9, color: C.muted,
        letterSpacing: "0.18em", textTransform: "uppercase", fontWeight: 500,
      }}>
        {label}
      </span>

      {badgeEl ? <div>{badgeEl}</div>
       : editing ? (
        <input autoFocus value={val}
          onChange={(e) => setVal(e.target.value)}
          onBlur={() => setEditing(false)}
          onKeyDown={(e) => { if (["Enter","Escape"].includes(e.key)) setEditing(false); }}
          style={{
            background: C.accentBg, border: `1px solid ${C.stroke}`,
            borderRadius: 6, color: C.ink, padding: "7px 10px",
            fontFamily: mono ? MONO : SANS, fontSize: 13, outline: "none", width: "100%",
          }}
        />
       ) : (
        <span style={{
          fontFamily: mono ? MONO : SANS,
          fontSize: mono ? 13 : 14,
          color: C.ink,
          letterSpacing: mono ? "0.03em" : 0,
        }}>
          {val}
        </span>
       )}

      {editable && !editing ? (
        <button
          onClick={() => setEditing(true)}
          style={{
            display: "inline-flex", alignItems: "center", gap: 5,
            padding: "5px 10px", borderRadius: 6,
            border: `1px solid ${C.strokeAlt}`,
            color: C.muted, fontSize: 11, fontWeight: 500,
            transition: "border-color 140ms, color 140ms",
          }}
          onMouseEnter={(e) => { e.currentTarget.style.borderColor = C.accent; e.currentTarget.style.color = C.accent; }}
          onMouseLeave={(e) => { e.currentTarget.style.borderColor = C.strokeAlt; e.currentTarget.style.color = C.muted; }}
        >
          {Ico.edit()} Editar
        </button>
      ) : <span />}
    </div>
  );
}

// ── Nav item ───────────────────────────────────────────────────────────────────
function NavItem({ icon, label, active = false, disabled = false, collapsed }) {
  const [hov, setHov] = useState(false);
  return (
    <button
      disabled={disabled}
      onMouseEnter={() => setHov(true)}
      onMouseLeave={() => setHov(false)}
      title={collapsed ? label : undefined}
      style={{
        width: "100%", display: "flex", alignItems: "center",
        gap: collapsed ? 0 : 12,
        justifyContent: collapsed ? "center" : "flex-start",
        padding: collapsed ? "11px 0" : "10px 14px",
        borderRadius: 8,
        background: active ? C.accentBg : hov && !disabled ? "rgba(20,26,15,0.04)" : "transparent",
        color: active ? C.accent : disabled ? C.subtle : C.muted,
        fontSize: 13, fontWeight: active ? 600 : 500, letterSpacing: "-0.01em",
        transition: "background 130ms, color 130ms",
        cursor: disabled ? "default" : "pointer",
        position: "relative",
        overflow: "hidden",
      }}
    >
      {active && (
        <span style={{
          position: "absolute", left: 0, top: "25%", bottom: "25%", width: 2,
          background: C.accent, borderRadius: 1,
        }} />
      )}
      {icon(active ? C.accent : disabled ? C.subtle : (hov ? C.ink : C.muted))}
      <span style={{
        overflow: "hidden", whiteSpace: "nowrap",
        maxWidth: collapsed ? 0 : 200,
        opacity: collapsed ? 0 : 1,
        transition: "max-width 220ms cubic-bezier(.4,0,.2,1), opacity 180ms",
      }}>
        {label}
      </span>
      {active && !collapsed && (
        <span style={{
          marginLeft: "auto", width: 5, height: 5, borderRadius: "50%",
          background: C.accent, flexShrink: 0,
        }} />
      )}
    </button>
  );
}

// ── Sidebar ────────────────────────────────────────────────────────────────────
function Sidebar({ collapsed, onToggle }) {
  const [soHov, setSoHov] = useState(false);
  const W = collapsed ? 64 : 232;

  return (
    <aside style={{
      position: "relative", zIndex: 20, flexShrink: 0,
      width: W, transition: "width 240ms cubic-bezier(.4,0,.2,1)",
      display: "flex", flexDirection: "column",
      background: C.sidebar,
      borderRight: `1px solid ${C.strokeAlt}`,
      boxShadow: "2px 0 16px rgba(20,26,15,0.06)",
    }}>
      {/* subtle pipe line */}
      <div style={{
        position: "absolute", left: collapsed ? "50%" : 28, top: 88, bottom: 120, width: 1,
        background: `linear-gradient(to bottom, transparent, ${C.strokeAlt} 15%, ${C.strokeAlt} 85%, transparent)`,
        transition: "left 240ms cubic-bezier(.4,0,.2,1)",
        pointerEvents: "none",
      }} />

      {/* collapse toggle */}
      <button
        onClick={onToggle}
        title={collapsed ? "Expandir menú" : "Colapsar menú"}
        style={{
          position: "absolute", top: 28, right: -14, zIndex: 30,
          width: 28, height: 28, borderRadius: "50%",
          background: C.sidebar, border: `1px solid ${C.strokeAlt}`,
          color: C.muted, display: "flex", alignItems: "center", justifyContent: "center",
          transform: collapsed ? "rotate(180deg)" : "rotate(0deg)",
          transition: "transform 240ms cubic-bezier(.4,0,.2,1), border-color 140ms, color 140ms",
          boxShadow: "0 2px 8px rgba(20,26,15,0.08)",
        }}
        onMouseEnter={(e) => { e.currentTarget.style.borderColor = C.accent; e.currentTarget.style.color = C.accent; }}
        onMouseLeave={(e) => { e.currentTarget.style.borderColor = C.strokeAlt; e.currentTarget.style.color = C.muted; }}
      >
        {Ico.chevronLeft(C.muted)}
      </button>

      {/* brand */}
      <div style={{
        display: "flex", alignItems: "center",
        gap: collapsed ? 0 : 10,
        justifyContent: collapsed ? "center" : "flex-start",
        padding: collapsed ? "22px 0" : "22px 20px",
        borderBottom: `1px solid ${C.strokeAlt}`,
        transition: "padding 240ms cubic-bezier(.4,0,.2,1)",
        overflow: "hidden",
      }}>
        <MufflerMark size={18} />
        <span style={{
          fontWeight: 600, fontSize: 15, letterSpacing: "-0.025em",
          color: C.ink, whiteSpace: "nowrap",
          maxWidth: collapsed ? 0 : 120, opacity: collapsed ? 0 : 1,
          overflow: "hidden",
          transition: "max-width 220ms cubic-bezier(.4,0,.2,1), opacity 160ms",
        }}>
          muffler
        </span>
        {!collapsed && (
          <span style={{
            marginLeft: "auto", fontFamily: MONO, fontSize: 9,
            color: C.muted, letterSpacing: "0.18em", flexShrink: 0,
          }}>
            v0.1
          </span>
        )}
      </div>

      {/* nav */}
      <nav style={{
        flex: 1, padding: collapsed ? "14px 8px" : "14px 12px",
        display: "flex", flexDirection: "column", gap: 2,
        transition: "padding 240ms cubic-bezier(.4,0,.2,1)",
        overflowX: "hidden",
      }}>
        {!collapsed && (
          <div style={{
            fontFamily: MONO, fontSize: 8, color: C.subtle,
            letterSpacing: "0.24em", textTransform: "uppercase",
            padding: "0 14px", marginBottom: 8, fontWeight: 600,
          }}>
            Nav
          </div>
        )}
        <NavItem icon={Ico.dashboard} label="Dashboard" disabled collapsed={collapsed} />
        <NavItem icon={Ico.profile}   label="Perfil"    active   collapsed={collapsed} />
        <NavItem icon={Ico.settings}  label="Settings"  disabled collapsed={collapsed} />
      </nav>

      {/* user chip + sign out */}
      <div style={{
        padding: collapsed ? "10px 8px 16px" : "10px 12px 16px",
        borderTop: `1px solid ${C.strokeAlt}`,
        transition: "padding 240ms cubic-bezier(.4,0,.2,1)",
      }}>
        {!collapsed && (
          <div style={{
            display: "flex", alignItems: "center", gap: 10,
            padding: "9px 14px", borderRadius: 8, marginBottom: 6,
            background: "rgba(20,26,15,0.03)",
            border: `1px solid ${C.strokeAlt}`,
            overflow: "hidden",
          }}>
            <div style={{
              width: 28, height: 28, borderRadius: "50%", flexShrink: 0,
              background: C.accentBg, border: `1px solid ${C.accentStr}`,
              display: "flex", alignItems: "center", justifyContent: "center",
              fontFamily: SANS, fontSize: 11, fontWeight: 700, color: C.accent, letterSpacing: "-0.04em",
            }}>AL</div>
            <div style={{ minWidth: 0 }}>
              <div style={{ fontSize: 12, fontWeight: 600, color: C.ink, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>
                Ada Lovelace
              </div>
              <div style={{ fontFamily: MONO, fontSize: 9, color: C.muted, letterSpacing: "0.08em" }}>Admin</div>
            </div>
          </div>
        )}

        <button
          onMouseEnter={() => setSoHov(true)}
          onMouseLeave={() => setSoHov(false)}
          title={collapsed ? "Sign Out" : undefined}
          style={{
            width: "100%", display: "flex", alignItems: "center",
            gap: collapsed ? 0 : 10, justifyContent: collapsed ? "center" : "flex-start",
            padding: collapsed ? "10px 0" : "10px 14px", borderRadius: 8,
            background: soHov ? "rgba(197,48,48,0.07)" : "transparent",
            color: C.danger, fontSize: 13, fontWeight: 500,
            transition: "background 130ms",
          }}
        >
          {Ico.signout(C.danger)}
          <span style={{
            overflow: "hidden", whiteSpace: "nowrap",
            maxWidth: collapsed ? 0 : 200, opacity: collapsed ? 0 : 1,
            transition: "max-width 220ms cubic-bezier(.4,0,.2,1), opacity 180ms",
          }}>
            Sign Out
          </span>
        </button>
      </div>
    </aside>
  );
}

// ── App ────────────────────────────────────────────────────────────────────────
function App() {
  const [collapsed, setCollapsed] = useState(false);
  const user = {
    nombre:   "Ada",
    apellido: "Lovelace",
    email:    "ada@muffler.app",
    role:     "Admin",
    since:    "12 Ene 2024",
  };

  return (
    <div style={{
      display: "flex", width: "100%", height: "100%",
      background: C.bg, overflow: "hidden",
    }}>
      <Sidebar collapsed={collapsed} onToggle={() => setCollapsed((c) => !c)} />

      <main style={{
        flex: 1, overflowY: "auto", position: "relative",
        padding: "44px 52px 52px",
        display: "flex", flexDirection: "column", gap: 28,
      }}>
        {/* page header */}
        <div>
          <div style={{
            fontFamily: MONO, fontSize: 9, color: C.muted,
            letterSpacing: "0.24em", textTransform: "uppercase", marginBottom: 6,
          }}>
            Cuenta <span style={{ color: C.subtle }}>·</span> Perfil
          </div>
          <h1 style={{ fontSize: 30, fontWeight: 500, letterSpacing: "-0.035em", lineHeight: 1.1, color: C.ink }}>
            Tu perfil
          </h1>
          <p style={{ fontSize: 14, color: C.muted, marginTop: 5 }}>
            Información personal y ajustes de cuenta.
          </p>
        </div>

        {/* ── profile card ──────────────────────────────────────────────── */}
        <section style={{
          background: C.surf,
          border: `1px solid ${C.strokeAlt}`,
          borderRadius: 16, overflow: "hidden",
          boxShadow: "0 4px 24px rgba(20,26,15,0.07), 0 1px 3px rgba(20,26,15,0.05)",
        }}>
          {/* card header */}
          <div style={{
            padding: "28px 32px",
            borderBottom: `1px solid ${C.strokeAlt}`,
            display: "flex", alignItems: "center", gap: 24, flexWrap: "wrap",
            background: "linear-gradient(135deg, #FAFBF7 0%, #F4F5F0 100%)",
          }}>
            <ProfileAvatar size={84} />

            <div style={{ flex: 1, minWidth: 180 }}>
              <h2 style={{ fontSize: 22, fontWeight: 600, letterSpacing: "-0.03em", lineHeight: 1.2, color: C.ink }}>
                {user.nombre} {user.apellido}
              </h2>
              <div style={{ marginTop: 7, display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
                <RoleBadge role={user.role} />
                <span style={{ fontFamily: MONO, fontSize: 11, color: C.muted, letterSpacing: "0.04em" }}>
                  {user.email}
                </span>
              </div>
              {/* since */}
              <div style={{
                marginTop: 10, display: "inline-flex", alignItems: "center", gap: 8,
                padding: "4px 12px 4px 8px", borderRadius: 999,
                background: C.accentBg, border: `1px solid ${C.accentStr}`,
              }}>
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke={C.accent} strokeWidth="2" strokeLinecap="round">
                  <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
                </svg>
                <span style={{ fontFamily: MONO, fontSize: 10, color: C.muted, letterSpacing: "0.08em" }}>
                  Miembro desde <span style={{ color: C.accent, fontWeight: 600 }}>{user.since}</span>
                </span>
              </div>
            </div>
          </div>

          {/* fields */}
          <div style={{ padding: "0 32px 8px", background: C.surfInner }}>
            <ProfileField label="Nombre"       value={user.nombre}   editable />
            <ProfileField label="Apellido"     value={user.apellido} editable />
            <ProfileField label="Email"        value={user.email}    editable mono />
            <ProfileField label="Rol"          value={user.role}     badgeEl={<RoleBadge role={user.role} />} />
            <ProfileField label="Miembro desde" value={user.since}   mono />
          </div>
        </section>

        {/* footer */}
        <div style={{
          display: "flex", justifyContent: "space-between",
          fontFamily: MONO, fontSize: 9, color: C.subtle, letterSpacing: "0.16em",
        }}>
          <span>MUFFLER · v0.1 · BETA</span>
          <span>EXHAUST SYS · MUFFLER AUTH</span>
        </div>
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
